<style>
  /* ---------- Change these ---------- */
  :root {
    --bg: #0000ff;          /* page colour */
    --fg: #ffffff;          /* text colour */
    --accent: #ffffff;      /* name colour */
    --perspective: 20vw;    /* lower = stronger fold distortion */
    --fold-w: 80vw;         /* width of the flat "window" */
    --fold-h: 80vh;         /* height of the flat "window" */
    --fold-angle: 90deg;    /* how far the top/bottom pages bend away */
  }
  @media (max-width: 767px) {
    :root { --fold-angle: 140deg; }
  }

  /* ---------- Base type (follows the CV) ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 1.05rem;
    line-height: 1.35;
  }
  ::selection { background: var(--fg); color: var(--bg); }
  a { color: var(--fg); text-underline-offset: 3px; }
  a[target="_blank"]::after { content: " ↗"; font-size: .8em; }
  b { font-weight: 600; }


  header { height: 88vh; display: flex; flex-direction: column; justify-content: flex-end; margin-bottom: 40px; }
  h1 { margin: 0 0 16px; color: var(--accent); font: 400 clamp(2rem, 5vw, 4rem)/1.1 "IBM Plex Mono", monospace; text-transform: uppercase; }
  .intro p { margin: 0 0 4px; }

  /* Each section = a ruled row: label | entries */
  section { display: grid; grid-template-columns: 10rem 1fr; gap: 0 1.5rem; border-top: 2px solid var(--fg); padding: 14px 0 18px; }
  h2 { font-size: 1em; font-weight: 600; margin: 0; }
  .entries > * + * { margin-top: 16px; }
  .entry { display: grid; grid-template-columns: 7rem 1fr 1fr; gap: 0 1.5rem; }
  .desc { font-size: .85em; }
  .kind { display: block; font-size: .8em; text-transform: uppercase; letter-spacing: .05em; opacity: .75; }
  .plain { margin: 0; }

  /* Projects: the row is clickable, opens a gallery + text */
  summary { cursor: pointer; list-style: none; position: relative; }
  summary::-webkit-details-marker { display: none; }
  summary .what b::after { content: " +"; }
  details[open] summary .what b::after { content: " –"; }
  .project-body { margin-left: 8.5rem; font-size: .9em; max-width: 75ch; padding-bottom: 8px; }
  .project-body p { margin: 10px 0 0; }
  .meta { opacity: .6; }
  .gallery { display: flex; gap: 8px; margin: 12px 0 4px; }
  /* flex-grow is set to each image's aspect ratio in the script, so both share one height */
  .gallery img { flex: 1 1 0; min-width: 0; width: 100%; height: auto; display: block; }

  /* Hover a closed project to peek at its main image */
  .peek { position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 280px; pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 1; }
  details:not([open]) summary:hover .peek { opacity: 1; }
  @media (hover: none) { .peek { display: none; } }

  footer { border-top: 2px solid var(--fg); padding: 14px 0 300px; }
  footer p { margin: 0; }

  @media (max-width: 767px) {
    body { font-size: .9rem; }
    header { height: 40vh; }
    section { grid-template-columns: 1fr; gap: 8px; }
    .entry { grid-template-columns: 1fr; gap: 2px; }
    .date { opacity: .6; }
    .project-body { margin-left: 0; }
    footer { padding-bottom: 100px; }
  }

  /* ---------- The 3D fold ---------- */
  .stage {
    position: fixed; inset: 0;
    overflow: hidden; /* keeps the bent folds from widening the page on iOS Safari */
    display: flex; align-items: center; justify-content: center;
  }
  .wrap3d { position: relative; perspective: var(--perspective); transform-style: preserve-3d; }
  .fold { width: var(--fold-w); height: var(--fold-h); overflow: hidden; }
  .fold-align { width: 100%; height: 100%; }
  .fold-top    { transform: rotateX(calc(var(--fold-angle) * -1)); transform-origin: bottom center; }
  .fold-bottom { transform: rotateX(var(--fold-angle));          transform-origin: top center; }
  .fold-top    .fold-align { transform: translateY(100%); }
  .fold-bottom .fold-align { transform: translateY(-100%); }
  .fold-content { will-change: transform; }

  @media (prefers-reduced-motion: reduce) {
    :root { --fold-angle: 0deg; }
  }

  /* Print / no-JS: a plain flat page */
  @media print {
    .stage { position: static; display: block; }
    .wrap3d { perspective: none; }
    .fold-top, .fold-bottom { display: none; }
    .fold { width: auto; height: auto; overflow: visible; }
    .fold-content { transform: none !important; }
    body { height: auto !important; }
  }
</style>
</head>

          <summary class="entry"><span class="date">2026</span><span class="what"><b>Break the Loop</b></span><span class="desc">a card system for ethical interface design</span><img class="peek" src="images/breaktheloop-1.jpg" alt="" loading="lazy"></summary>
          <div class="project-body">
            <div class="gallery"><img src="images/breaktheloop-1.jpg" alt="Break the Loop, image 1" loading="lazy"><img src="images/breaktheloop-3.jpg" alt="Break the Loop, image 2" loading="lazy"></div>
            <p class="meta">Individual · I2ADS / FCT · Intentional friction, ethical interface design, game design · <a href="https://lerolerolerola.github.io/cardsystem_btl/menu-match.html" target="_blank" rel="noopener noreferrer">Website</a></p>
            <p>BA final project, developed within the Break the Loop research project. It challenges the human-centred design obsession with seamlessness and proposes intentional friction as a design strategy, borrowing mechanics from game design. The Flow Deck has five card sets (Friction Patterns, Platforms, Challenges, Flow and Connectors) played across three modes of increasing complexity, from spotting patterns alone to collaboratively mapping user flows with ethical interventions. It comes with a rulebook, analysis canvases and a website with a card scanner linked to the Friction Design Archive. The identity draws on 90s net art and ASCII art.</p>
            <p class="meta">Role: research, system design (decks, game modes, rulebook), visual identity, website. Playtested in workshops with design students.</p>

            <p class="meta">ID+ / I2ADS, FBAUP · FCT-funded · Design for health, non-verbal communication</p>
            <p>A research project exploring drawing as a non-verbal language for people with partial to total Locked-In Syndrome, using residual movement or gaze as the interface to reconnect patients with peers, family, caregivers and therapists in immersive, collaborative environments. I help prototype and test an eye-tracking VR drawing tool (Unity), including sessions with experts, patients, caregivers and therapists.</p>
            <p>I am also designing and prototyping <i>Léxico de Gestos</i>, a browser-based add-on that extends the tool from drawing to communication. Instead of a fixed vocabulary, it learns each user's own gestures for words from three to five examples (ml5.js/DoodleNet with the $P recogniser), and the user confirms every match before it enters a message.</p>
            <p>I also designed and maintain the website: a background of loose strokes that react to the cursor, drawing as gesture, the interface as a space between people. It hosts XTREMERS, an international symposium on the body as interface for extreme users (November 2026).</p>

            <p>A browser-based text adventure where you play a field investigator sent to ten procedurally generated, recently abandoned houses, examining objects and filling in assessment reports on unexplained anomalies. It plays on the tension between bureaucratic language and the inexplicable (after Uketsu's <i>Strange Houses</i>, Disco Elysium, MUDs), grounded in Ryan, Aarseth, Stenros, Wilson &amp; Sicart and Marttila. It also reflects critically on AI-assisted writing and programming.</p>

        <div class="entry"><span class="date">In prep.</span><span class="what">Full paper</span><span class="desc"><span class="kind">Written submission</span>Miguel, H., Portelinha, L., Cardoso, P. <i>Companionship Mechanics in AI-Driven Character Platforms: Deceptive and Friction Design in Character.ai</i></span></div>
        <details>
          <summary class="entry"><span class="date">2026</span><span class="what"><b>XTREMERS Symposium</b></span><span class="desc"><span class="kind">Written submission</span>Miguel, H., Portelinha, L., Lopes, R. <i>Somatic Electronic Music Instrument (SEMI): A Screenless Gestural Instrument for Live Electronic Music Performance</i> (abstract accepted)</span></summary>
          <div class="project-body"><p>Although consumer hardware has made electronic music tools widely accessible, production and performance remain bound to ocularcentric interfaces, confining musical control to the two-dimensional screen. This paper introduces the Somatic Electronic Music Instrument (SEMI), a screenless gestural instrument for live performance. Using a consumer webcam, SEMI tracks the performer’s hands with MediaPipe and routes gesture data through TouchDesigner to a six-voice VCV Rack patch. Hand position shapes synthesis, gestures navigate layers, and spoken cues orient the performer. Rooted in Oliveros’s listening practice and somaesthetics, SEMI treats non-visual operation as a generative constraint that engages motor memory and somatic listening.</p></div>
        </details>
        <div class="entry"><span class="date">2026</span><span class="what">XTREMERS Symposium</span><span class="desc"><span class="kind">Participation</span>Organising team</span></div>
        <details>
          <summary class="entry"><span class="date">2026</span><span class="what"><b>UNLOOP Symposium</b></span><span class="desc"><span class="kind">Written submission</span>Miguel, H., Portelinha, L., Cardoso, P. <i>Companionship Mechanics in AI-Driven Character Platforms: Deceptive and Friction Design in Character.ai</i></span></summary>
          <div class="project-body"><p>This paper examines how conversational AI companion platforms such as Character.ai structure user engagement through highly customizable interaction systems that reinforce flow and addiction-oriented behaviors. Combining interface analysis with literature on AI companions, flow, deceptive patterns, and friction design, this study identifies how mechanics such as memory curation, response regeneration, editing, and narrative branching minimize conversational consequence while maximizing immersion and emotional responsiveness. Rather than arguing for the proscription of AI companions, this paper proposes friction design interventions capable of introducing reflection, uncertainty, and consequence into otherwise seamless interactions, fostering critical and meaningful forms of human-AI engagement.</p></div>
        </details>

<script>
(() => {
  const tpl = document.getElementById('content');
  const panes = [...document.querySelectorAll('[data-fold]')];
  panes.forEach(p => p.appendChild(tpl.content.cloneNode(true)));

  // Decorative copies: keep them out of tab order
  document.querySelectorAll('.fold-top a, .fold-bottom a').forEach(a => a.tabIndex = -1);

  document.querySelectorAll('.fold-top summary, .fold-bottom summary').forEach(el => el.tabIndex = -1);

  const center = document.getElementById('center-content');
  const centerFold = document.getElementById('center-fold');

  // The body gets a fake height so the native scrollbar drives the folds
  const setHeight = () => {
    const h = center.clientHeight - centerFold.clientHeight;
    document.body.style.height = (h + window.innerHeight) + 'px';
  };

  const tick = () => {
    const y = -(window.scrollY || document.documentElement.scrollTop || 0);
    panes.forEach(p => p.style.transform = `translateY(${y}px)`);
    requestAnimationFrame(tick);
  };

  // Keep open/closed projects in sync across the 3 copies (toggle doesn't bubble, so capture)
  document.addEventListener('toggle', e => {
    const all = panes.map(p => [...p.querySelectorAll('details')]);
    const i = all.find(list => list.includes(e.target)).indexOf(e.target);
    all.forEach(list => { if (list[i].open !== e.target.open) list[i].open = e.target.open; });
    setHeight();
  }, true);

  // Images change the page height as they load
  document.addEventListener('load', e => {
    if (e.target.tagName !== 'IMG') return;
    if (e.target.closest('.gallery')) e.target.style.flexGrow = e.target.naturalWidth / e.target.naturalHeight;
    setHeight();
  }, true);


  window.addEventListener('resize', setHeight);
  document.fonts && document.fonts.ready.then(setHeight);

  setHeight();
  tick();

})();
</script>
